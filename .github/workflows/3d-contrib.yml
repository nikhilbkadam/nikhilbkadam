name: GitHub Profile 3D Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: nikhilbkadam
      - name: Push to 3d-output branch
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r profile-3d-contrib /tmp/profile-3d-contrib
          git checkout -B 3d-output
          git rm -rq . 2>/dev/null || true
          mkdir -p profile-3d-contrib
          cp -r /tmp/profile-3d-contrib/. profile-3d-contrib/
          git add profile-3d-contrib
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "update 3d contrib"
            git push --force origin 3d-output
          fi
